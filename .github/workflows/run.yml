name: run
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Pyrefly
        run: pip install pyrefly==1.4.1
      - name: Start the Glean container
        run: |
          docker run -d --name glean -v "$PWD:/work" --entrypoint sleep \
            ghcr.io/facebookincubator/glean/demo:latest infinity
      - name: Index, index incrementally, and query callers
        run: python3 scripts/run.py
      - name: Show the Glean commands
        if: always()
        run: tail -c 20000 out/glean_commands.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: |
            out
            facts
